{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container">
    <h2>Mi Perfil</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Usuario:</strong> {{ user.username }}</p>
            <p><strong>Nombre:</strong> {{ user.get_full_name }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
        </div>
    </div>
</div>
{% endblock %}
